# Tooling del proyecto (DEC-016, Fase 7) + empaquetado (DEC-018).
# Instalable en editable (`pip install -e .`) para que tests y scripts
# resuelvan los paquetes sin hacks de sys.path. Las dependencias de runtime
# siguen en requirements.txt a propósito (contrato del scheduler y README);
# [project] no las duplica.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-pedidos"
version = "0.1.0"
description = "Pipeline scraper -> ETL -> dashboard de pedidos (miempresa)"
requires-python = ">=3.12"

[tool.setuptools]
# Lista explícita: excluye tests/ y scraper/archive/ (sin __init__.py, solo referencia)
packages = ["comun", "dashboard", "etl", "inventario", "scraper", "scraper.migrations"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "scraper/archive",   # referencia histórica — regla del proyecto: no tocar
    ".venv",
]

[tool.ruff.lint]
# Baseline gradual: errores reales (E4xx import, E7xx statement, E9xx
# runtime, F pyflakes) + orden de imports (I) + bugbear (B).
# E501 (línea larga) queda fuera a propósito: SQL y mensajes de log
# legibles pesan más que el corte duro.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
# `theme` y `db` se importan sin el prefijo `dashboard.` porque Streamlit
# pone el directorio del entry point (dashboard/) en sys.path — son
# módulos propios aunque el import no lo parezca. (`components` se
# eliminó del proyecto en DEC-103 — retirado de esta lista el 2026-08-27,
# hallazgo de la auditoría de documentación del 2026-08-26.)
known-first-party = [
    "comun",
    "scraper",
    "etl",
    "dashboard",
    "inventario",
    "theme",
    "db",
]

[tool.mypy]
python_version = "3.12"
# Global laxo: el gate pre-commit solo corre sobre comun/ (DEC-016).
# La strictness se amplía módulo por módulo.
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "comun.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_equality = true
